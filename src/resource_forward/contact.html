<section id="contact" data-contact-form data-emailjs-public-key="61GtFyVFJ4xDftkIG" data-emailjs-service="service_nicpl0u" data-emailjs-template="template_h4ve5sp">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">협업 문의</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">
                <form id="my-form">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <label for="email-subject">문의 제목</label>
                                <input type="text" name="mail_title" class="form-control" id="email-subject"
                                    placeholder="어떤 일을 함께하고 싶으신가요?" required
                                    data-validation-required-message="Please submit the subject." />
                                <p class="help-block text-danger"></p>
                            </div>

                            <div class="control-group form-group">
                                <label for="full-name">이름</label>
                                <input type="text" name="mail_name" class="form-control" placeholder="홍길동" autocomplete="name"
                                    id="full-name" required data-validation-required-message="Please enter your name.">
                                <p class="help-block text-danger"></p>
                            </div>

                            <div class="control-group form-group">
                                <label for="institution">소속 <span>(선택)</span></label>
                                <input type="text" name="mail_institution" class="form-control" placeholder="회사·기관명" autocomplete="organization" id="institution">
                            </div>

                            <div class="control-group form-group">
                                <label for="email-address">이메일</label>
                                <input type="email" name="mail_email" class="form-control" placeholder="답변받을 이메일 주소" autocomplete="email"
                                    id="email-address" required
                                    data-validation-required-message="Please enter your email address.">
                                <p class="help-block text-danger"></p>
                            </div>

                            <div class="control-group form-group">
                                <label for="telephone">연락처</label>
                                <input type="tel" name="mail_phone" class="form-control" placeholder="010-0000-0000" autocomplete="tel"
                                    id="telephone" required
                                    data-validation-required-message="Please enter your phone number.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <label for="message">문의 내용</label>
                                <textarea name="mail_message" class="form-control" placeholder="주제, 일정, 대상과 함께 필요한 내용을 알려주세요." rows="7"
                                    id="message" required
                                    data-validation-required-message="Please enter a message."></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>

                        <div class="clearfix"></div>

                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" id="my-form-submit-button" class="btn btn-xl">문의 보내기 <span aria-hidden="true">↗</span></button>
                        </div>
                    </div>

                    <p id="my-form-status" role="status" aria-live="polite"></p>
                </form>

            </div>
        </div>

        <div class="col-lg-12 text-center">
            <hr />
            <br /><br /><br />
            <h4 class="section-heading">책 내용에 대한 문의는 카페를 이용해주세요</h4>
            <a id="cafe-button" class="btn btn-xl" href="https://cafe.naver.com/bhban">카페 바로가기</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/needleworm/needleworm.github.io@main/src/resource_forward/contact.js" defer></script>
</section>
