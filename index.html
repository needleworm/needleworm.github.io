                                    <div class="select-items select-hide">

                                        <div data-value="+82">KR (+82)</div>

                                        <div data-value="+81">JP (+81)</div>
                                        <div data-value="+86">CN (+86)</div>
                                        <div data-value="">직접입력</div>
                                    </div>
                                </div>

                    </div>

                            <h5>FAKER: Full-body Anonymization with Human Keypoint Extraction for Real-time Video
                                Deidentification</h5><br />
                            <p class="bookDescription">
                                <strong>Byunghyun Ban*, Hyoseok Lee (2024)</strong><br />
                                ArXiv Preprint
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    In the contemporary digital era, protection of personal information has become a
                                    paramount issue. The exponential growth of the media industry has heightened
                                    concerns regarding the anonymization of individuals captured in video footage.
                                    Traditional methods, such as blurring or pixelation, are commonly employed, while
                                    recent advancements have introduced generative adversarial networks (GAN) to redraw
                                    faces in videos. In this study, we propose a novel approach that employs a
                                    significantly smaller model to achieve real-time full-body anonymization of
                                    individuals in videos. Unlike conventional techniques that often fail to effectively
                                    remove personal identification information such as skin color, clothing,
                                    accessories, and body shape while our method successfully eradicates all such
                                    details. Furthermore, by leveraging pose estimation algorithms, our approach
                                    accurately represents information regarding individuals' positions, movements, and
                                    postures. This algorithm can be seamlessly integrated into CCTV or IP camera systems
                                    installed in various industrial settings, functioning in real-time and thus
                                    facilitating the widespread adoption of full-body anonymization technology.
                                </p>

                            <p class="bookDescription">

                                ICTC 2023
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    We present 'CongNaMul', a comprehensive dataset designed for various tasks in
                                    soybean sprouts image analysis. The CongNaMul dataset is curated to facilitate tasks
                                    such as image classification, semantic segmentation, decomposition, and measurement
                                    of length and weight. The classification task provides four classes to determine the
                                    quality of soybean sprouts: normal, broken, spotted, and broken and spotted, for the
                                    development of AI-aided automatic quality inspection technology. For semantic
                                    segmentation, images with varying complexity, from single sprout images to images
                                    with multiple sprouts, along with human-labelled mask images, are included. The
                                    label has 4 different classes: background, head, body, tail. The dataset also
                                    provides images and masks for the image decomposition task, including two separate
                                    sprout images and their combined form. Lastly, 5 physical features of sprouts (head
                                    length, body length, body thickness, tail length, weight) are provided for
                                    image-based measurement tasks. This dataset is expected to be a valuable resource
                                    for a wide range of research and applications in the advanced analysis of images of
                                    soybean sprouts. Also, we hope that this dataset can assist researchers studying
                                    classification, semantic segmentation, decomposition, and physical feature
                                    measurement in other industrial fields, in evaluating their models. The dataset is
                                    available at the authors' repository.

                                    A text-mining-based word function categorization method and LSTM-based vocabulary

                                    developed as a data screening tool but showed 4.35 ~ 6.21 times higher than previous
                                    works. An LSTM deep learning method is also suggested for vocabulary appearance
                                    pattern prediction method. AI performs a regression with various size of data window

                                    Predicted values of AI over various data windows are processed into a single score
                                    as a weighted sum, which we call an "AI-Score", which represents the probability of

                        <div class="projectText">
                            <h5>Mathematical Model and Simulation for Nutrient-Plant Interaction Analysis</h5><br />
                            <p class="bookDescription">
                                <strong>Byunghyun Ban</strong> (2020)<br />
                                2020 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    Differential equation models to understand interaction between plant and nutrient
                                    solution are presented. The root cells selectively emit H+ ions with active
                                    transport consuming ATPs to establish electrical gradient along the cell membrane.
                                    It establishes electrical field with Nernst potential to make positively charged
                                    ions outside the cell membrane flow into the root cell. Anion influx is also
                                    modulated by H+ ion concentration because plant root cell absorbs negatively charged
                                    particles with symport. If an anion collides with H+ cell to make net charge as
                                    neutral, at symport channel, it can flow through. In this paper, mathematical models
                                    for cation and anion absorption are introduced. Cation absorption model was induced
                                    from Ohm's law combined with Goldman's equation. Anion absorption model is similar
                                    to chemical reaction rate model. Both models have physiological terms influenced by
                                    gene expression pattern, species or phenotypes. Cation model also includes terms for
                                    ion's kinetic and electrical properties, growth of plant and interaction between the
                                    root and the surroundings. Simulation for 20 different sets of coefficients showed
                                    that the physiology-related coefficient has important role on nutrition absorption
                                    tendencies of plants.
                                </p>
                            </div>

                <div class="singleProjectContainer">

                        <div class="projectText">
                            <h5>Deep learning method to remove chemical, kinetic and electric artifacts on ISEs</h5>
                            <br />
                            <p class="bookDescription">
                                <strong>Byunghyun Ban</strong> (2020)<br />
                                2020 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    I suggest a deep learning based sensor signal processing method to remove chemical,
                                    kinetic and electrical artifacts from ion selective electrodes' measured values. An
                                    ISE is used to investigate the concentration of a specific ion from aqueous
                                    solution, by measuring the Nernst potential along the glass membrane. However,
                                    application of ISE on a mixture of multiple ion has some problem. First problem is a
                                    chemical artifact which is called ion interference effect. Electrically charged
                                    particles interact with each other and flows through the glass membrane of different
                                    ISEs. Second problem is the kinetic artifact caused by the movement of the liquid.
                                    Water molecules collide with the glass membrane causing abnormal peak values of
                                    voltage. The last artifact is the interference of ISEs. When multiple ISEs are
                                    dipped into same solution, one electrode's signal emission interference voltage
                                    measurement of other electrodes. Therefore, an ISE is recommended to be applied on
                                    single-ion solution, without any other sensors applied at the same time. Deep
                                    learning approach can remove both 3 artifacts at the same time. The proposed method
                                    used 5 layers of artificial neural networks to regress correct signal to remove
                                    complex artifacts with one-shot calculation. Its MAPE was less than 1.8% and R 2 of
                                    regression was 0.997. A randomly chosen value of AI processed data has MAPE less
                                    than 5% (p-value 0.016).
                                </p>

                            <h5>Nutrient Solution Management System for Smart Farms and Plant Factory</h5><br />
                            <p class="bookDescription">
                                <strong>Byunghyun Ban</strong>*, Janghun Lee, Donghun Ryu, Minwoo Lee, Tae Dong Eom
                                (2020)<br />
                                2020 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    We present an automated system for nutrient solution management. Prior arts usually
                                    measure only pH and EC of the nutrient solutions for maintenance. When EC drops,
                                    they just simply add concentrated nutrient to the horticulture bed. Such approach
                                    can maintain the density of nutrient solution but cannot maintain the rates of
                                    individual ion particles. To prevent nutrition related disorders, fertilization
                                    methods with ion selective electrodes are widely introduced. This trend measures
                                    individual ion concentration of nutrient solution to maintain appropriate nutrient
                                    composition by supplying only insufficient ions. Many researchers have suggested ISE
                                    based automated fertilization systems. However, they failed to control a chemical
                                    artifact called ion interference effect, which becomes greater at higher density.
                                    Our system measures individual concentration of multiple ions and add only deficient
                                    nutrients, while handling the ion interference effect issue. To ensure the
                                    performance of ion selective electrodes, the system also performs fully automated
                                    3-point calibration 24 times a day. A machine learning algorithm is applied on the
                                    sensory parts to remove ion interference effect which make measurement of complex
                                    solution with ISE almost impossible. With automated calibration and signal
                                    processing technology, the system robustly and continuously maintains nutrient
                                    condition for plants. We suggest applying this system on closed hydroponic systems
                                    such as smart farms or plant factory, to reduce water consumption and to provide
                                    more appropriate environment for the crops.
                                </p>

                            <h5>Machine Learning Approach to Remove Ion Interference Effect in Agricultural Nutrient
                                Solutions</h5><br />
                            <p class="bookDescription">
                                <strong>Byunghyun Ban</strong>*, Minwoo Lee, Donghun Ryu (2019)<br />
                                2019 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    High concentration agricultural facilities such as vertical farms or plant factories
                                    consider hydroponic techniques as optimal solutions. Although closed-system
                                    dramatically reduces water consumption and pollution issues, it has ion-ratio
                                    related problem. As the root absorbs individual ions with different rate, ion rate
                                    in a nutrient solution should be adjusted periodically. But traditional method only
                                    considers pH and electrical conductivity to adjust the nutrient solution, leading to
                                    ion imbalance and accumulation of excessive salts. To avoid those problems, some
                                    researchers have proposed ion-balancing methods which measure and control each ion
                                    concentration. However, those approaches use titration-like heuristic approaches,
                                    which repeat adding small amount of components and measuring ion density a lot of
                                    times for a single control input. Both traditional and recent methods are not only
                                    time-consuming, but also cannot predict chemical reactions related with control
                                    inputs because the nutrient solution is a nonlinear complex system, including many
                                    precipitation reactions and complicated interactions. We present a continuous
                                    network model of the nutrient solution system, whose reactions are described as
                                    differential equations. The model predicts molar concentration of each chemical
                                    components and total dissolved solids with low error. This model also can calculate
                                    the amount of chemical compounds needed to produce a desired nutrient solution, by
                                    reverse calculation from dissolved ion concentrations.
                                </p>
                            </div>

                            <br />
                            <p class="bookDescription">

                                2019 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    In closed hydroponic systems, periodic readjustment of nutrient solution is
                                    necessary to continuously provide stable environment to plant roots because the
                                    interaction between plant and nutrient solution changes the rate of ions in it. The
                                    traditional method is to repeat supplying small amount of premade concentrated
                                    nutrient solution, measuring total electric conductivity and pH of the tank only. As
                                    it cannot control the collapse of ion rates, recent researches try to measure the
                                    concentration of individual components to provide insufficient ions only. However,
                                    those approaches use titration-like heuristic approaches, which repeat adding small
                                    amount of components and measuring ion density a lot of times for a single control
                                    input. Both traditional and recent methods are not only time-consuming, but also
                                    cannot predict chemical reactions related with control inputs because the nutrient
                                    solution is a nonlinear complex system, including many precipitation reactions and
                                    complicated interactions. We present a continuous network model of the nutrient
                                    solution system, whose reactions are described as differential equations. The model
                                    predicts molar concentration of each chemical components and total dissolved solids
                                    with low error. This model also can calculate the amount of chemical compounds
                                    needed to produce a desired nutrient solution, by reverse calculation from dissolved
                                    ion concentrations.
                                </p>

                            <p class="bookDescription">

                                2017 International Conference on Information and Communication Technology Convergence
                                (ICTC)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    We propose new generative adversarial networks for generalized image deconvolution,
                                    GAN-D. Most of the previous researches concentrate to specific sub-topic of image
                                    deconvolution or generative image deconvolution models with a strong assumption.
                                    However, our network restores visual data from distorted images applied multiple
                                    dominant degradation problems such as noise, blur, saturation, compression without
                                    any prior information. As a generator, we leverage convolutional neural networks
                                    based ODCNN [12] which perform generalized image deconvolution with a decent
                                    performance, and we use VGGNet [11] to distinguish true/fake of an input image as a
                                    discriminator. We devise the loss function of the generator of GAN-D which combines
                                    mean square error (MSE) of network output and ground-truth images to traditional
                                    adversarial loss of GAN. This loss function and the presence of discriminator
                                    reinforces the generator to produce more high-quality images than the original model
                                    structured with a single convolutional neural network. During experiments with four
                                    datasets, we find that our network has higher PSNR/SSIM values and qualitative
                                    results than ODCNN.

                        <div class="projectText">
                            <h5>The phenotype control kernel of a biomolecular regulatory network</h5><br />
                            <p class="bookDescription">
                                Sang-Mok Choo, <strong>Byunghyun Ban</strong>, Ja Il Joo, Kwnag-Hyun Cho* (2018)<br />
                                BMC Systems Biology &nbsp;(SCI)
                            </p>
                            <div class="codeBody">
                                <p class="bookDescription">
                                    Background<br />
                                    Controlling complex molecular regulatory networks is getting a growing attention as
                                    it can provide a systematic way of driving any cellular state to a desired cell
                                    phenotypic state. A number of recent studies suggested various control methods, but
                                    there is still deficiency in finding out practically useful control targets that
                                    ensure convergence of any initial network state to one of attractor states
                                    corresponding to a desired cell phenotype.<br /><br />
                                    Results<br />
                                    To find out practically useful control targets, we introduce a new concept of
                                    phenotype control kernel (PCK) for a Boolean network, defined as the collection of
                                    all minimal sets of control nodes having their fixed state values that can generate
                                    all possible control sets which eventually drive any initial state to one of
                                    attractor states corresponding to a particular cell phenotype of interest. We also
                                    present a detailed method with which we can identify PCK in a systematic way based
                                    on the layered network and converging tree of a given network. We identify all
                                    candidates for control nodes from the layered network and then hierarchically search
                                    for all possible minimal sets by using the converging tree. We show the usefulness
                                    of PCK by applying it to cell proliferation and apoptosis signaling networks and
                                    comparing the results with other control methods. PCK is the unique control method
                                    for Boolean network models that can be used to identify all possible minimal sets of
                                    control nodes. Interestingly, many of the minimal sets have only one or two control
                                    nodes.<br /><br />
                                    Conclusions<br />
                                    Based on the new concept of PCK, we can identify all possible minimal sets of
                                    control nodes that can drive any molecular network state to one of multiple
                                    attractor states representing a same desired cell phenotype.<br /><br />
                                </p>

                            <h5>대립 신경망을 이용한 심혈관 단층촬영 영상 표지 방법</h5><br />
                            <p class="bookDescription">

                                한국과학기술원 (석사학위논문)

                            <div class="codeBody">

                                    것으로 질병을 빠르고 정밀하게 진단하기 위한 보조 수단으로써 각광받고 있다. 종래 기계학습 기반의 의료영상 표지기술은 통계적 추론에 근거하여 표지 대상
                                    구역과 그 외부 구역을 분할하도록 목적함수를 최소화하는 것을 공통적인 철학으로써 공유하는데, 심장 단층촬영 사진으로부터 관상동맥만을 특이적으로 표지하는
                                    등 의료영상 내부의 표지 대상과 비 표지 대상의 비율이 한 쪽으로 치우친 경우 학습에 실패하여 전방위적인 오류를 도출한다. 본 논문에서는 완전연결
                                    컨볼루션 뉴럴 네트워크의 2차원 확률분포 철학을 계승하며 영상 윈도잉 기법을 제안하여 클래스 밸런스 문제를 해결한다. 또한 생성적 대립 신경망이 비
                                    생성적 인공지능의 성능 향상에 기여할 수 있다는 가능성을 제안하며 대립 신경망 학습을 통해 분류 대상의 비율이 극단적으로 치우친 경우에도 강건하게
                                    작동하고, 인간이 발견하지 못 한 관상동맥을 발견한 혁신적인 성능의 의료영상 표지기술을 제안한다.
