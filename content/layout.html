<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c3e50">
    <meta name="naver-site-verification" content="0159ed33b1faaa2234f04e02a584f51839076f3b">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="반병현(Byunghyun Ban)">
    {{EXTRA_HEAD}}
    <link rel="canonical" href="{{URL}}">
    <link rel="alternate" type="application/rss+xml" title="반병현 RSS" href="/feed.xml">
    <link rel="alternate" type="application/feed+json" title="반병현 JSON Feed" href="/feed.json">
    <meta property="og:type" content="{{OG_TYPE}}">
    <meta property="og:locale" content="{{OG_LOCALE}}">
    <meta property="og:site_name" content="반병현">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/44e1e0b11c.js" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/page.css?v={{PAGE_CSS_VERSION}}">
    <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N1GJ70ELXP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-N1GJ70ELXP');
    </script>
    {{LIBRARIES}}
    <script src="/continuous-scroll.js?v={{SCROLL_VERSION}}" defer></script>
    <script src="/script.js?v={{SCRIPT_VERSION}}" defer></script>
</head>
<body class="static-site full-content {{BODY_CLASS}}" data-page="{{PAGE_KEY}}">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    {{NAVIGATION}}
    {{HERO}}
    <main id="main-content" class="container page-main {{MAIN_CLASS}}">
        {{PAGE_HEADER}}
        {{MAIN}}
    </main>
    {{MOBILE_NEXT_PAGE}}
    <footer class="site-footer">
        <div class="container">
            <nav class="footer-links" aria-label="전체 페이지">{{FOOTER_LINKS}}</nav>
            <p><a href="/feed.xml">RSS 구독</a> · <a href="/feed.json">JSON Feed</a></p>
            <p>&copy; 2026 Byunghyun Ban. All rights reserved.</p>
            <p>나나랩(NaNa Lab) (사업자등록번호:269-08-02374) 대표자 반 병 현</p>
        </div>
    </footer>
    <button class="btn-to-top" id="btn-to-top" type="button" aria-label="맨 위로 이동">↑</button>
</body>
</html>
